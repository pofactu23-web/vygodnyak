<style>
:root{--bg:#f8f9fc;--white:#fff;--navy:#2e4057;--navy2:#3d5270;--blue:#7fa4c0;--gray:#7a8fa0;--light:#e8eef5;--border:#dde4ed;--text:#1a2535;--defect-bg:#fdecea;--defect-col:#c0392b;--success-bg:#e6f4ee;--success-col:#2a7a5a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

/* NAV */
.nav{background:var(--navy);position:sticky;top:0;z-index:100;}
.nav-top{display:flex;align-items:center;padding:12px 16px 10px;}
.nav-logo{flex:1;display:flex;flex-direction:column;gap:1px;}
.nav-logo-main{font-family:'Playfair Display',serif;font-size:21px;letter-spacing:1px;color:#fff;line-height:1;}
.nav-logo-main span{color:var(--blue);}
.nav-logo-sub{font-size:10px;color:rgba(255,255,255,0.45);letter-spacing:1.5px;text-transform:uppercase;font-family:'DM Sans',sans-serif;font-weight:400;}
.nav-icons{display:flex;gap:8px;}
.nic{background:rgba(255,255,255,0.12);border:none;color:#fff;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;position:relative;transition:background .15s;}
.nic:active{background:rgba(255,255,255,0.22);}
.badge{position:absolute;top:-5px;right:-5px;background:var(--blue);color:#fff;font-size:9px;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;}
.badge.h{display:none;}

/* BOTTOM TAB BAR */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 8px;cursor:pointer;gap:4px;transition:color .15s;color:var(--gray);border:none;background:none;}
.tab.on{color:var(--navy);}
.tab-icon{font-size:20px;line-height:1;}
.tab-label{font-size:10px;letter-spacing:.5px;font-weight:500;}

/* PAGES */
.page{padding-bottom:70px;}

/* GENDER ROW (catalog page) */
.gender-row{display:flex;padding:12px 12px 6px;gap:8px;}
.g-btn{flex:1;padding:8px 0;font-size:12px;letter-spacing:.5px;font-weight:500;color:var(--gray);background:var(--white);border:1px solid var(--border);cursor:pointer;border-radius:8px;transition:all .2s;}
.g-btn.on{background:var(--navy);color:#fff;border-color:var(--navy);}

/* SEARCH */
.srch{padding:0 12px 8px;}
.srch input{width:100%;background:var(--white);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;}
.srch input:focus{border-color:var(--blue);}
.srch input::placeholder{color:var(--gray);}

/* PRODUCT GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s;}
.card:active{transform:scale(0.97);}
.cimg{aspect-ratio:3/4;background:var(--light);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.cimg img{width:100%;height:100%;object-fit:cover;display:block;}
.cem{font-size:50px;}
.ctag{position:absolute;top:8px;left:0;font-size:10px;letter-spacing:.5px;padding:4px 9px;font-weight:600;border-radius:0 5px 5px 0;}
.ctag.disc{background:var(--navy);color:#fff;}
.ctag.defect{background:var(--defect-bg);color:var(--defect-col);}
.ctag.new{background:var(--light);color:var(--navy);}
.cinfo{padding:10px 12px 12px;}
.cname{font-size:13px;line-height:1.35;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cprices{display:flex;align-items:baseline;gap:5px;margin-bottom:8px;}
.cprice{font-size:15px;font-weight:600;color:var(--navy);}
.cprice.def{color:var(--defect-col);}
.cold{font-size:11px;color:var(--gray);text-decoration:line-through;}
.cbtn{width:100%;background:var(--navy);border:none;color:#fff;padding:8px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;border-radius:6px;transition:background .15s;}
.cbtn:active{background:var(--navy2);}
.cbtn.ic{background:var(--success-bg);color:var(--success-col);}

/* CATEGORIES PAGE */
.cats-page{padding:14px 12px 0;}
.cats-section{margin-bottom:20px;}
.cats-section-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);font-weight:500;margin-bottom:10px;padding-left:2px;}
.cats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cat-card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;}
.cat-card:active{transform:scale(0.97);}
.cat-card.wide{grid-column:1/-1;flex-direction:row;align-items:center;}
.cat-img{height:90px;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;overflow:hidden;}
.cat-card.wide .cat-img{width:90px;height:80px;flex-shrink:0;border-radius:0;}
.cat-img-bg{position:absolute;inset:0;opacity:0.07;font-size:90px;display:flex;align-items:center;justify-content:center;filter:blur(2px);}
.cat-icon{position:relative;z-index:1;font-size:42px;}
.cat-card.wide .cat-icon{font-size:36px;}
.cat-info{padding:10px 12px 12px;}
.cat-card.wide .cat-info{flex:1;padding:12px 14px;}
.cat-name{font-size:14px;font-weight:500;color:var(--text);margin-bottom:3px;}
.cat-count{font-size:12px;color:var(--gray);}
.cat-arrow{color:var(--blue);font-size:18px;margin-right:14px;}

/* GALLERY */
.gallery{position:relative;aspect-ratio:1;background:var(--light);overflow:hidden;touch-action:pan-y;}
.gallery-track{display:flex;height:100%;transition:transform .3s cubic-bezier(.25,.46,.45,.94);will-change:transform;}
.gallery-slide{flex-shrink:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--light);}
.gallery-slide img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;}
.gallery-em{font-size:90px;}
.gallery-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none;}
.gdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.5);transition:all .2s;}
.gdot.on{background:#fff;width:18px;border-radius:3px;}
.gallery-tag{position:absolute;top:10px;left:0;font-size:10px;letter-spacing:.5px;padding:4px 9px;font-weight:600;border-radius:0 5px 5px 0;z-index:2;}
.gallery-tag.disc{background:var(--navy);color:#fff;}
.gallery-tag.defect{background:var(--defect-bg);color:var(--defect-col);}
.gallery-counter{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.35);color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;z-index:2;}
.det-body{padding:18px 16px 24px;}
.det-em{font-size:100px;}
.det-tags{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.dtag{font-size:11px;padding:4px 10px;border-radius:5px;font-weight:500;}
.dtag.cat{background:var(--light);color:var(--navy);}
.dtag.gen{background:rgba(127,164,192,0.15);color:var(--navy2);}
.dtag.def{background:var(--defect-bg);color:var(--defect-col);}
.det-name{font-family:'Playfair Display',serif;font-size:21px;font-weight:400;line-height:1.3;margin-bottom:12px;}
.det-prices{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
.det-price{font-size:24px;font-weight:600;color:var(--navy);}
.det-price.def{color:var(--defect-col);}
.det-old{font-size:15px;color:var(--gray);text-decoration:line-through;}
.det-save{display:inline-block;font-size:12px;background:#fff3e0;color:#b85c00;padding:3px 9px;border-radius:5px;font-weight:600;margin-bottom:12px;}
.det-desc{font-size:14px;color:var(--gray);line-height:1.7;margin-bottom:20px;}
.det-btn{width:100%;background:var(--navy);border:none;color:#fff;padding:14px;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;border-radius:10px;}
.det-btn.ic{background:var(--success-bg);color:var(--success-col);}
.back{background:none;border:none;color:var(--gray);font-size:13px;font-family:'DM Sans',sans-serif;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:5px;}

/* CART DRAWER */
.drw-bg{position:fixed;inset:0;background:rgba(20,30,45,0.5);z-index:200;display:none;}
.drw-bg.open{display:block;}
.drw{position:fixed;bottom:0;left:0;right:0;background:var(--white);z-index:201;border-top:3px solid var(--navy);border-radius:20px 20px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);}
.drw-bg.open .drw{transform:none;}
.drw-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;}
.drw-title{font-family:'Playfair Display',serif;font-size:17px;flex:1;}
.drw-x{background:var(--light);border:none;color:var(--gray);width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.drw-body{flex:1;overflow-y:auto;padding:0 16px;}
.ci{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.ci-pic{width:54px;height:70px;background:var(--light);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex-shrink:0;}
.ci-pic img{width:100%;height:100%;object-fit:cover;}
.ci-info{flex:1;}
.ci-nm{font-size:13px;line-height:1.35;margin-bottom:3px;}
.ci-pr{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:8px;}
.qty{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.qb{background:none;border:none;color:var(--text);width:28px;height:28px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qb:active{background:var(--light);}
.qn{width:28px;text-align:center;font-size:13px;font-weight:600;border-left:1px solid var(--border);border-right:1px solid var(--border);line-height:28px;}
.drw-foot{padding:14px 16px 18px;border-top:1px solid var(--border);}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.tot-l{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);}
.tot-v{font-family:'Playfair Display',serif;font-size:22px;color:var(--navy);}
.ofields{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.oinp{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 13px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;border-radius:8px;width:100%;}
.oinp:focus{border-color:var(--navy);}
.oinp::placeholder{color:var(--gray);}
.obtn{width:100%;background:var(--navy);border:none;color:#fff;padding:14px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;border-radius:10px;}
.obtn:disabled{opacity:.45;}
.empty-c{text-align:center;padding:48px 0;color:var(--gray);font-size:14px;}

/* SUCCESS */
.win{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;padding:40px 24px;text-align:center;}
.win-circle{width:76px;height:76px;border:2px solid var(--navy);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--navy);margin-bottom:20px;}
.win-title{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:8px;}
.win-sub{font-size:14px;color:var(--gray);line-height:1.7;margin-bottom:26px;}
.win-btn{background:var(--navy);border:none;color:#fff;padding:13px 30px;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-family:'DM Sans',sans-serif;cursor:pointer;border-radius:8px;}

/* ADMIN */
.adm{padding:16px 16px 40px;}
.adm-h{font-family:'Playfair Display',serif;font-size:19px;margin-bottom:4px;}
.adm-sub{font-size:13px;color:var(--gray);margin-bottom:18px;}
.fl{margin-bottom:12px;}
.fl-l{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gray);margin-bottom:5px;font-weight:500;}
.fi{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:10px 13px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;border-radius:8px;}
.fi:focus{border-color:var(--navy);}
.fi::placeholder{color:var(--gray);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.asv{width:100%;background:var(--navy);border:none;color:#fff;padding:12px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;border-radius:8px;margin-top:4px;}
.acn{width:100%;background:none;border:1px solid var(--border);color:var(--gray);padding:11px;font-size:12px;text-transform:uppercase;font-family:'DM Sans',sans-serif;cursor:pointer;border-radius:8px;margin-top:8px;}
.alh{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin:22px 0 10px;}
.ar{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.ai{width:42px;height:54px;background:var(--light);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0;}
.ai img{width:100%;height:100%;object-fit:cover;}
.ainfo{flex:1;}
.anm{font-size:13px;margin-bottom:2px;}
.apr{font-size:12px;color:var(--navy);font-weight:600;}
.aedt{background:var(--light);border:1px solid var(--border);color:var(--navy);padding:5px 9px;font-size:12px;cursor:pointer;border-radius:6px;margin-right:4px;}
.adel{background:none;border:1px solid var(--border);color:var(--gray);padding:5px 9px;font-size:12px;cursor:pointer;border-radius:6px;}

.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;font-size:13px;z-index:400;border-radius:20px;animation:ta 2.5s forwards;white-space:nowrap;}
@keyframes ta{0%{opacity:0;transform:translateX(-50%) translateY(8px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}75%{opacity:1}100%{opacity:0}}
.nores{grid-column:1/-1;text-align:center;padding:60px 16px;color:var(--gray);font-size:14px;}
</style>
</head>

};

const sc=()=>localStorage.setItem('sl3_c',JSON.stringify(S.cart));

function sp(){
  if(!window._db) return;
  const productsObj={};
  S.products.forEach(p=>{ productsObj['p_'+p.id]=p; });
  window._set(window._ref(window._db,'products'), productsObj)
    .catch(e=>console.error('Firebase save error:',e));
}

function loadProducts(){
  if(!window._db){ setTimeout(loadProducts,300); return; }
  S.loading=true; render();
  window._get(window._ref(window._db,'products')).then(snap=>{
    if(snap.exists()){
      const data=snap.val();
      S.products=Object.values(data).sort((a,b)=>a.id-b.id);
    } else {
      // First load - save demo data
      S.products=DEMO;
      sp();
    }
    S.loading=false;
    render();
  }).catch(e=>{ console.error(e); S.loading=false; render(); });
  // Real-time sync
  window._onValue(window._ref(window._db,'products'), snap=>{
    if(snap.exists()){
      const data=snap.val();
      S.products=Object.values(data).sort((a,b)=>a.id-b.id);
      render();
    }
  });
}
const cnt=()=>S.cart.reduce((a,i)=>a+i.qty,0);
const tot=()=>S.cart.reduce((a,i)=>a+i.price*i.qty,0);
const disc=p=>p.oldPrice&&p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):null;
const inC=id=>S.cart.some(i=>i.id===id);
const h=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const catInfo=id=>CATS.find(x=>x.id===id)||{label:id,emoji:'📦'};
const genLabel=g=>({m:'Мужское',f:'Женское',u:'Унисекс'}[g]||'');
const prodCountByCat=id=>S.products.filter(p=>p.cat===id).length;

function addCart(p){const e=S.cart.find(i=>i.id===p.id);if(e)e.qty++;else S.cart.push({...p,qty:1});sc();render();toast('Добавлено в корзину ✓');}
function delCart(id){S.cart=S.cart.filter(i=>i.id!==id);sc();render();}
function chQty(id,d){const i=S.cart.find(x=>x.id===id);if(!i)return;i.qty+=d;if(i.qty<=0)delCart(id);else{sc();render();}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

async function checkout(){
  if(!S.oName.trim()||!S.oPhone.trim()){toast('Укажите имя и телефон');return;}
  S.sending=true;render();
  const items=S.cart.map(i=>`• ${i.emoji} ${i.name} × ${i.qty} = ${(i.price*i.qty).toLocaleString('ru')} ₽`).join('\n');
  const txt=`🛒 <b>Новый заказ!</b>\n\n👤 <b>Имя:</b> ${S.oName}\n📱 <b>Телефон:</b> ${S.oPhone}${S.oAddr?'\n📍 <b>Адрес:</b> '+S.oAddr:''}\n\n<b>Товары:</b>\n${items}\n\n💰 <b>Итого: ${tot().toLocaleString('ru')} ₽</b>`;
  try{await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:OWNER_CHAT_ID,text:txt,parse_mode:'HTML'})});}catch(e){}

function bind(){
  const $=id=>document.getElementById(id);

  // tabs
  $('tab-shop')?.addEventListener('click',()=>{S.tab='shop';S.view='list';S.filterCat='';render();});
  $('tab-cats')?.addEventListener('click',()=>{S.tab='cats';render();});
  $('tab-admin')?.addEventListener('click',()=>{S.tab='admin';render();});

  // cart
  $('btn-cart')?.addEventListener('click',()=>{S.cartOpen=true;render();});
  $('cls-cart')?.addEventListener('click',()=>{S.cartOpen=false;render();});
  $('drw-bg')?.addEventListener('click',e=>{if(e.target.id==='drw-bg'){S.cartOpen=false;render();}});

  // nav
  $('btn-back')?.addEventListener('click',()=>{S.view='list';render();});
  $('btn-back-cat')?.addEventListener('click',()=>{S.view='list';S.filterCat='';S.tab='shop';render();});

  // search & gender
  $('sinp')?.addEventListener('input',e=>{S.search=e.target.value;render();});
  document.querySelectorAll('[data-g]').forEach(el=>el.addEventListener('click',()=>{S.gender=el.dataset.g;render();}));

  // open product
  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{S.sel=S.products.find(p=>p.id==el.dataset.open);S.view='detail';render();}));

  // add to cart
  document.querySelectorAll('[data-add]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();addCart(S.products.find(p=>p.id==el.dataset.add));}));
  $('btn-da')?.addEventListener('click',()=>{if(!inC(S.sel.id))addCart(S.sel);else{S.cartOpen=true;render();}});

  // GALLERY SWIPE
  const gallery=document.getElementById('gallery');
  const gtrack=document.getElementById('gtrack');
  const gdots=document.getElementById('gdots');
  const gcounter=document.getElementById('gcounter');
  if(gallery&&gtrack){
    const slides=gtrack.children.length;
    let cur=0,startX=0,isDrag=false,moved=false;
    const goTo=i=>{
      cur=Math.max(0,Math.min(slides-1,i));
      gtrack.style.transition='transform .3s cubic-bezier(.25,.46,.45,.94)';
      gtrack.style.transform=`translateX(-${cur*(100/slides)}%)`;
      if(gcounter) gcounter.textContent=`${cur+1} / ${slides}`;
      if(gdots){[...gdots.children].forEach((d,j)=>d.classList.toggle('on',j===cur));}
    };
    gallery.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;isDrag=true;moved=false;gtrack.style.transition='none';},{passive:true});
    gallery.addEventListener('touchmove',e=>{
      if(!isDrag)return;
      const dx=e.touches[0].clientX-startX;
      if(Math.abs(dx)>5) moved=true;
      gtrack.style.transform=`translateX(calc(-${cur*(100/slides)}% + ${dx/slides}px))`;
    },{passive:true});
    gallery.addEventListener('touchend',e=>{
      if(!isDrag)return; isDrag=false;
      const dx=e.changedTouches[0].clientX-startX;
      if(Math.abs(dx)>50) goTo(dx<0?cur+1:cur-1); else goTo(cur);
    });
  }

  // open category from cats tab
  document.querySelectorAll('[data-catopen]').forEach(el=>el.addEventListener('click',()=>openCat(el.dataset.catopen)));

  // qty
  document.querySelectorAll('[data-m]').forEach(el=>el.addEventListener('click',()=>chQty(+el.dataset.m,-1)));
  document.querySelectorAll('[data-p]').forEach(el=>el.addEventListener('click',()=>chQty(+el.dataset.p,1)));

  // order
  $('o-nm')?.addEventListener('input',e=>S.oName=e.target.value);
  $('o-ph')?.addEventListener('input',e=>S.oPhone=e.target.value);
  $('o-ad')?.addEventListener('input',e=>S.oAddr=e.target.value);
  $('btn-order')?.addEventListener('click',checkout);

  // admin
  $('btn-save')?.addEventListener('click',()=>{
    const _photos=[0,1,2,3,4].map(i=>($('a-p'+i)?.value||'').trim()).filter(Boolean);
    S.form={name:$('a-name')?.value||'',price:$('a-price')?.value||'',oldPrice:$('a-old')?.value||'',
      cat:$('a-cat')?.value||'clothes-m',gender:$('a-gen')?.value||'u',
      emoji:$('a-emoji')?.value||'📦',img:_photos[0]||'',photos:_photos,desc:$('a-desc')?.value||'',
      defect:$('a-defect')?.value==='1'};
    saveProd();
  });
  $('btn-cancel')?.addEventListener('click',()=>{S.editId=null;S.form={name:'',price:'',oldPrice:'',cat:'clothes-m',gender:'m',emoji:'📦',img:'',desc:'',defect:false};render();});
  document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>editProd(S.products.find(p=>p.id==el.dataset.edit))));
  document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>{if(confirm('Удалить товар?'))delProd(+el.dataset.del);}));
}

render();

// Init Firebase
function initFirebase(){
  if(window._firebaseReady){ loadProducts(); }
  else { window.addEventListener('firebaseReady', loadProducts, {once:true}); }
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', initFirebase);
} else { initFirebase(); }
</script>
</body>
</html>
